[project]
name = "yapar"
version = "0.1.0"
requires-python = ">=3.12"
description = "SLR(1) parser generator with LR(0) automaton construction"
license = { text = "MIT" }
authors = [{ name = "Fernando Mendoza", email = "lfmendoza.alvarez@gmail.com" }]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.coverage.run]
source = ["src/yapar"]

[tool.ruff]
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]
